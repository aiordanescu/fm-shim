[package]
name = "fm-shim"
version = "0.1.0"
edition = "2024"
description = "Proxy for Apple's `fm serve` that rewrites the requests it rejects (tool-schema unions, developer role, reasoning_effort)"
license = "MIT"
repository = "https://github.com/aiordanescu/fm-shim"
readme = "README.md"
keywords = ["apple", "foundation-models", "openai", "proxy", "llm"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1.19"

[profile.release]
lto = true
strip = true
codegen-units = 1
